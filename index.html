<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOAP-E 임상 사례 포트폴리오 — 인체구조와 기능</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#EFF4FA;
    --surface:#FFFFFF;
    --surface-2:#E4EEF9;
    --ink:#132436;
    --ink-soft:#54677C;
    --ink-faint:#8C9CAE;
    --line:#DCE6F1;
    --teal:#1478C4;
    --teal-dark:#0C5590;
    --teal-soft:#E3F1FC;
    --coral:#FF6A4D;
    --coral-dark:#C8431F;
    --coral-soft:#FFE7DD;
    --radius:14px;
    --font-sans:'Pretendard', -apple-system, sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);line-height:1.6;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{margin:0;font-weight:800;letter-spacing:-0.02em;}
  p{margin:0;}
  button{font-family:inherit;cursor:pointer;}
  textarea{font-family:inherit;}
  .wrap{max-width:880px;margin:0 auto;padding:0 20px 80px;}

  /* ---------- hero card (Paystra 참고 스타일) ---------- */
  .page-pad{max-width:880px;margin:0 auto;padding:16px 16px 0;}
  .hero-card{position:relative;overflow:hidden;border-radius:28px;padding:22px 26px 70px;
    background:linear-gradient(160deg,#3FA9FF 0%,#1479E8 55%,#0B5AC0 100%);
    box-shadow:0 20px 40px rgba(11,90,192,0.28);}
  .hero-nav{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-badge{font-family:var(--font-mono);font-weight:700;font-size:12px;background:rgba(255,255,255,0.18);color:#fff;padding:5px 9px;border-radius:8px;letter-spacing:0.04em;border:1px solid rgba(255,255,255,0.3);}
  .brand-title{font-size:14.5px;font-weight:700;color:#fff;position:relative;display:inline-block;transition:opacity .2s;}
  .brand-title:hover{opacity:0.85;cursor:default;}
  .brand-sub{font-size:11.5px;color:rgba(255,255,255,0.75);}
  .nav-pill-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.35);color:#fff;font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:999px;transition:all .15s;}
  .nav-pill-btn:hover{background:rgba(255,255,255,0.28);}

  .hero-content{position:relative;z-index:2;text-align:center;padding-top:34px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;letter-spacing:0.12em;color:rgba(255,255,255,0.85);margin-bottom:14px;}
  .hero-content h1{font-size:30px;color:#fff;line-height:1.35;}
  .hero-content p{margin-top:12px;color:rgba(255,255,255,0.85);font-size:14px;max-width:420px;margin-left:auto;margin-right:auto;}
  .hero-cta-row{display:flex;gap:10px;justify-content:center;margin-top:22px;}
  .cta-solid{background:#fff;color:var(--teal-dark);border:none;font-size:13.5px;font-weight:700;padding:12px 22px;border-radius:999px;transition:transform .15s;}
  .cta-solid:hover{transform:translateY(-2px);}
  .cta-outline{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.55);color:#fff;font-size:13.5px;font-weight:700;padding:12px 22px;border-radius:999px;transition:all .15s;}
  .cta-outline:hover{background:rgba(255,255,255,0.22);}

  .cloud-deco{position:absolute;left:0;right:0;bottom:-2px;height:70px;z-index:1;
    background:radial-gradient(60% 100% at 20% 100%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%),
               radial-gradient(50% 100% at 55% 100%, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 72%),
               radial-gradient(55% 100% at 88% 100%, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 70%);
    opacity:0.35;filter:blur(2px);pointer-events:none;}

  .stat-float-row{position:relative;z-index:3;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:-46px 4px 0;}
  .stat-card{background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:0 10px 26px rgba(19,36,54,0.12);display:flex;align-items:center;gap:12px;transition:transform .15s;}
  .stat-card:hover{transform:translateY(-3px);}
  .stat-icon{width:36px;height:36px;border-radius:10px;background:var(--teal-soft);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .stat-val{font-size:17px;font-weight:800;line-height:1.1;}
  .stat-lbl{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .gems-toast{position:relative;z-index:3;max-width:280px;margin:14px auto 0;background:var(--surface);border-radius:14px;padding:10px 14px;box-shadow:0 10px 24px rgba(19,36,54,0.12);display:flex;align-items:center;gap:10px;font-size:12.5px;transform:rotate(-1.2deg);}
  .gems-toast .check{width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
  .gems-toast a{color:var(--teal-dark);font-weight:700;text-decoration:none;}

  @media(max-width:600px){
    .stat-float-row{grid-template-columns:1fr;margin-top:-30px;}
    .hero-content h1{font-size:24px;}
  }

  .icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink-soft);transition:all .15s;}
  .icon-btn:hover{border-color:var(--teal);color:var(--teal);}

  /* ---------- hero section title ---------- */
  .hero{padding:36px 0 20px;}
  .hero h1{font-size:26px;}
  .hero p{margin-top:8px;color:var(--ink-soft);font-size:14px;}

  /* ---------- accordion ---------- */
  .accordion{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:18px 0;overflow:hidden;}
  .accordion-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;cursor:pointer;}
  .accordion-head h2{font-size:15px;position:relative;display:inline-block;transition:color .2s;}
  .accordion-head h2::after{content:'';position:absolute;left:0;bottom:-4px;width:0;height:2px;background:var(--teal);transition:width .25s ease;}
  .accordion-head:hover h2{color:var(--teal-dark);}
  .accordion-head:hover h2::after{width:100%;}
  .accordion-head .chev{transition:transform .2s;color:var(--ink-faint);}
  .accordion.open .chev{transform:rotate(180deg);}
  .accordion-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .accordion.open .accordion-body{max-height:3000px;}
  .accordion-body-inner{padding:4px 20px 26px;font-size:15.5px;line-height:1.85;color:var(--ink);}
  .accordion-body-inner > p{margin-bottom:14px;}
  .accordion-body-inner h3{display:flex;align-items:center;flex-wrap:wrap;gap:9px;font-size:16px;color:var(--ink);margin:26px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--line);}
  .accordion-body-inner h3:first-child{margin-top:4px;}
  .mono-tag{font-family:var(--font-mono);font-weight:700;font-size:13px;background:var(--teal);color:#fff;padding:4px 10px;border-radius:6px;white-space:nowrap;}
  .en-term{font-family:var(--font-mono);font-size:13.5px;font-weight:500;color:var(--teal-dark);}
  .accordion-body-inner ul{margin:8px 0 16px;padding-left:22px;}
  .accordion-body-inner li{margin-bottom:8px;}
  .accordion-body-inner b{color:var(--teal-dark);font-weight:700;}
  .tip-box{background:var(--surface-2);border-radius:10px;padding:16px 18px;margin-top:18px;font-size:14.5px;line-height:1.9;}

  /* ---------- date rail ---------- */
  .date-rail{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;}
  .date-pill{flex:0 0 auto;font-family:var(--font-mono);font-size:12.5px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap;}
  .date-pill.active{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700;}

  .required-banner{display:flex;align-items:center;gap:10px;background:var(--coral-soft);color:var(--coral-dark);border-radius:10px;padding:12px 14px;font-size:13.5px;font-weight:600;margin-bottom:16px;}
  .required-banner .num{font-family:var(--font-mono);}

  /* ---------- case grid ---------- */
  .case-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .case-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;border-left:5px solid var(--teal);transition:transform .12s, box-shadow .12s;}
  .case-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,36,31,0.08);}
  .case-card .cid{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);}
  .case-card .ctitle{position:relative;display:inline-block;margin-top:6px;font-size:14.5px;font-weight:700;line-height:1.4;transition:color .2s;}
  .case-card .ctitle::after{content:'';position:absolute;left:0;bottom:-3px;width:0;height:2px;background:var(--teal);transition:width .25s ease;}
  .case-card:hover .ctitle{color:var(--teal-dark);}
  .case-card:hover .ctitle::after{width:100%;}
  .empty-note{color:var(--ink-faint);font-size:13.5px;padding:30px 4px;text-align:center;}

  /* ---------- case detail ---------- */
  .back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);background:none;border:none;padding:14px 0;}
  .chart-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;}
  .rafts-strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px;}
  .rafts-cell{background:var(--teal-soft);padding:10px 12px;}
  .rafts-cell .lbl{font-family:var(--font-mono);font-size:10.5px;color:var(--teal-dark);font-weight:700;}
  .rafts-cell .val{font-size:12.5px;margin-top:4px;color:var(--ink);}
  .scenario-text{font-size:14px;color:var(--ink);white-space:pre-wrap;margin-bottom:20px;padding-bottom:18px;border-bottom:1px dashed var(--line);}

  .soap-row{margin-bottom:16px;}
  .soap-row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .soap-row-head .left{display:flex;align-items:center;gap:8px;}
  .copy-btn{font-size:11.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);padding:5px 10px;border-radius:7px;}
  .copy-btn:hover{border-color:var(--teal);color:var(--teal);}
  textarea.soap-input{width:100%;min-height:64px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;resize:vertical;background:#FCFDFB;}
  textarea.soap-input:focus{outline:none;border-color:var(--teal);}

  .action-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);}
  .btn{border:none;border-radius:10px;padding:11px 16px;font-size:13.5px;font-weight:700;}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-secondary{background:var(--surface);border:1px solid var(--line);color:var(--ink);}
  .btn-secondary:hover{border-color:var(--ink);}
  .btn-coral{background:var(--coral);color:#fff;}
  .btn-coral:hover{background:var(--coral-dark);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;}
  .toast.show{opacity:1;}

  /* ---------- modal / admin ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(21,36,31,0.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-box{background:var(--surface);border-radius:16px;padding:26px;width:100%;max-width:380px;}
  .modal-box h2{font-size:17px;margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px;font-family:inherit;}
  .field textarea{min-height:70px;resize:vertical;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
  .err-text{color:var(--coral-dark);font-size:12.5px;margin-top:6px;}

  .admin-shell{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;}
  .admin-top{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
  .admin-tabs{display:flex;gap:6px;padding:14px 20px 0;max-width:960px;margin:0 auto;}
  .admin-tab{font-size:13px;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);transition:all .15s;}
  .admin-tab:hover{border-color:var(--teal);color:var(--teal-dark);}
  .admin-tab.active{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700;}
  .admin-body{max-width:960px;margin:0 auto;padding:18px 20px 60px;}
  .admin-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;}
  .admin-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .admin-row:last-child{border-bottom:none;}
  .pill-btn{font-size:12px;padding:6px 11px;border-radius:7px;border:1px solid var(--line);background:var(--surface);}
  .pill-btn.danger{color:var(--coral-dark);border-color:var(--coral-soft);}
  .section-title{position:relative;display:inline-block;font-size:13px;font-weight:700;color:var(--ink-soft);margin:22px 0 8px;text-transform:uppercase;letter-spacing:.04em;transition:color .2s;}
  .section-title::after{content:'';position:absolute;left:0;bottom:-4px;width:0;height:2px;background:var(--teal);transition:width .25s ease;}
  .section-title:hover{color:var(--teal-dark);}
  .section-title:hover::after{width:100%;}
  .inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .inline-form input, .inline-form select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;}
  .schedule-group{margin-bottom:14px;}
  .schedule-group .date-h{font-family:var(--font-mono);font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--teal-soft);color:var(--teal-dark);font-size:12px;padding:5px 10px;border-radius:999px;margin:0 6px 6px 0;}

  @media(max-width:600px){
    .rafts-strip{grid-template-columns:1fr;}
    .admin-tabs{overflow-x:auto;}
  }
</style>
</head>
<body>

<div class="page-pad">
  <div class="hero-card">
    <nav class="hero-nav">
      <div class="brand">
        <span class="brand-badge">S·O·A·P·E</span>
        <div>
          <div class="brand-title">인체구조와 기능 — 임상 사례 포트폴리오</div>
          <div class="brand-sub">SOAP-E 활동지</div>
        </div>
      </div>
      <button class="nav-pill-btn" id="adminBtn" title="관리자">⚙ 관리자</button>
    </nav>
    <div class="hero-content">
      <div class="eyebrow">— SOAP-E 임상 사례 포트폴리오 —</div>
      <h1>오늘의 사례를 확인하고<br>SOAP-E 기록지를 작성해보세요</h1>
      <p>날짜를 선택하고, 등록된 사례 중 하나를 골라 SOAP-E 기록지를 작성합니다.</p>
      <div class="hero-cta-row">
        <button class="cta-solid" id="ctaGuide">가이드 보기</button>
        <button class="cta-outline" id="ctaCases">사례 보러가기</button>
      </div>
    </div>
    <div class="cloud-deco"></div>
  </div>

  <div class="stat-float-row" id="statFloatRow">
    <div class="stat-card"><div class="stat-icon">📋</div><div><div class="stat-val">-</div><div class="stat-lbl">오늘 등록된 사례</div></div></div>
    <div class="stat-card"><div class="stat-icon">✏️</div><div><div class="stat-val">-</div><div class="stat-lbl">오늘의 필수 작성 개수</div></div></div>
    <div class="stat-card"><div class="stat-icon">🗂️</div><div><div class="stat-val">-</div><div class="stat-lbl">전체 등록된 사례 수</div></div></div>
  </div>
  <div class="gems-toast" id="gemsToast" style="display:none;"></div>
</div>

<div class="wrap" id="mainWrap">
  <div class="accordion" id="guideAccordion">
    <div class="accordion-head" id="guideToggle">
      <h2>SOAP-E란? 항목별 작성 가이드</h2>
      <span class="chev">⌄</span>
    </div>
    <div class="accordion-body"><div class="accordion-body-inner" id="guideContent"></div></div>
  </div>

  <div id="scheduleSection"></div>
  <div id="caseGridSection"></div>
  <div id="caseDetailSection"></div>
</div>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>
<div id="adminRoot"></div>

<script>
/* ======================= 설정 ======================= */
const CONFIG = {
  // 배포한 Apps Script 웹 앱 URL을 여기에 붙여넣으세요.
  API_URL: "https://script.google.com/macros/s/AKfycbzDwtHLTVlbFLq5Irvxem5y_pHTRJ68_XabeGcV-lAS6W9OPaosetr2-vxEsIHjf9ds/exec"
};

const CASE_FIELDS = ['사례ID','제목','Role','Audience','Task','시나리오','모범_S','모범_O','모범_A1','모범_A2','모범_P','모범_E'];
const SOAP_ROWS = [
  {key:'S',  label:'S',   en:'Subjective',  hint:'환자가 직접 말한 증상·느낌'},
  {key:'O',  label:'O',   en:'Objective',   hint:'관찰·측정으로 확인된 사실'},
  {key:'A1', label:'A-1', en:'Assessment · Diagnostic Impression', hint:'진단적 판단'},
  {key:'A2', label:'A-2', en:'Assessment · Pathophysiology',       hint:'생리적 기전'},
  {key:'P',  label:'P',   en:'Plan',        hint:'처치 계획'},
  {key:'E',  label:'E',   en:'Explanation', hint:'환자 설명(대화체)'}
];

const state = {
  studentData: null,   // doGet 결과 (모범답안 제외)
  adminData: null,     // 관리자 로그인 후 doGet 결과 (모범답안 포함)
  adminPw: null,
  isAdmin: false,
  selectedDate: null,
  selectedCase: null,  // {systemName, caseId}
  answers: {}          // caseId -> {S,O,A1,A2,P,E}
};

/* ======================= 공용 유틸 ======================= */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 1800);
}
function el(html){
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstChild;
}
function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
async function api(action, fields, extra){
  const body = Object.assign({action, pw: state.adminPw, fields: fields||{}}, extra||{});
  const res = await fetch(CONFIG.API_URL, {method:'POST', body: JSON.stringify(body)});
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || '요청 실패');
  return json.data;
}
async function loadStudentData(){
  const res = await fetch(CONFIG.API_URL);
  state.studentData = await res.json();
}
async function loadAdminData(pw){
  const res = await fetch(CONFIG.API_URL + '?pw=' + encodeURIComponent(pw));
  const json = await res.json();
  if(!json.isAdmin) throw new Error('비밀번호가 올바르지 않습니다.');
  state.adminData = json;
  state.adminPw = pw;
  state.isAdmin = true;
}

/* ======================= SOAP-E 안내 콘텐츠 ======================= */
const GUIDE_HTML = `
  <p>SOAP는 실제 의료 현장에서 환자 기록을 남길 때 쓰는 표준 형식입니다. 여기에 "환자에게 설명하기" 단계를 더해 <b>SOAP-E</b>로 확장했습니다. 제시된 상황 속에서 <b>Role</b>(맡은 역할)이 되어 <b>Audience</b>(만나는 대상)를 마주하고, 주어진 <b>Task</b>(해야 할 일)를 SOAP-E 틀에 따라 수행해보세요.</p>

  <h3><span class="mono-tag">S</span> <span class="en-term">Subjective · 주관적 정보</span></h3>
  <p>환자 또는 보호자가 "직접 말한" 증상, 느낌, 병력. 검사기기 없이는 확인할 수 없는 정보입니다.</p>
  <ul>
    <li>증상의 양상: 언제부터(onset), 어디가(location), 어떤 느낌인지(quality), 얼마나 심한지(severity)</li>
    <li>환자가 표현한 불안·걱정 등 심리적 반응</li>
    <li>과거 병력(PMH), 복용 약물, 가족력 등 환자가 진술한 정보</li>
  </ul>
  <p>찾는 법: 시나리오 속 큰따옴표 대사, "~라고 말한다" 서술 부분. 흔한 실수: 혈압·부종처럼 관찰된 사실을 S에 적는 것(→ O로).</p>

  <h3><span class="mono-tag">O</span> <span class="en-term">Objective · 객관적 정보</span></h3>
  <p>검사자가 직접 관찰·촉진·측정해서 확인한, 누가 봐도 같은 결과가 나오는 사실입니다.</p>
  <ul>
    <li>활력징후(Vital signs): 혈압(BP), 맥박(HR), 호흡수(RR), 체온(BT), 산소포화도(SpO2)</li>
    <li>신체 검진 소견, 검사 수치</li>
  </ul>
  <p>흔한 실수: "~인 것 같다"처럼 이미 해석·판단이 들어간 문장을 O에 적는 것(→ A로).</p>

  <h3><span class="mono-tag">A-1</span> <span class="en-term">Assessment · Diagnostic Impression · 진단적 판단</span></h3>
  <p>S와 O를 종합해서 내리는 임상적 판단. 가장 가능성 높은 소견과, 확인이 필요한 위험한 가능성을 함께 정리합니다.</p>
  <ul>
    <li><b>r/o(rule out)</b>는 "이미 배제됐다"는 뜻이 아니라, 의심되는 진단명 앞에 붙여 "추가 검사로 확인/배제가 필요하다"는 뜻입니다. 놓치면 위험한 진단에 주로 붙입니다.</li>
  </ul>

  <h3><span class="mono-tag">A-2</span> <span class="en-term">Assessment · Pathophysiology · 생리적 기전</span></h3>
  <p>A-1의 판단이 "왜" 타당한지 인체 구조·기능 원리로 설명하는, 가장 핵심적인 사고 과정입니다. 원인 → 신체 반응 → 증상으로 이어지는 인과관계를 단계적으로(1. 2. 3.) 서술하세요.</p>

  <h3><span class="mono-tag">P</span> <span class="en-term">Plan · 처치 계획</span></h3>
  <p>응급도 판단(triage), 즉각적 처치, 전문의/병원 의뢰 필요 여부, 경과 관찰 기준 등 지금 취해야 할 조치입니다.</p>

  <h3><span class="mono-tag">E</span> <span class="en-term">Explanation · 환자 설명</span></h3>
  <p>A-2의 원리를 전문용어 없이 환자가 이해할 수 있는 말로 풀어, 대화체로 작성합니다.</p>

  <div class="tip-box">
    <b>작성 순서 팁</b><br>
    1. S/O 구분해서 옮겨 적기 → 2. S·O 근거로 A-1 정리 → 3. A-1이 왜 타당한지 A-2로 설명 → 4. A-1·A-2 바탕으로 P 정하기 → 5. A-2를 쉬운 말로 바꿔 E 작성
  </div>
`;

function allScheduleDates(){
  const dates = [...new Set(state.studentData.schedule.map(s=>s.date))];
  return dates.sort();
}

function renderDateRail(){
  const dates = allScheduleDates();
  if(dates.length === 0){
    document.getElementById('scheduleSection').innerHTML = '<p class="empty-note">아직 등록된 수업일정이 없습니다.</p>';
    return;
  }
  const today = new Date().toISOString().slice(0,10);
  if(!state.selectedDate || !dates.includes(state.selectedDate)){
    state.selectedDate = dates.includes(today) ? today : dates[dates.length-1];
  }
  const pills = dates.map(d => `<button class="date-pill ${d===state.selectedDate?'active':''}" data-date="${d}">${d}</button>`).join('');
  document.getElementById('scheduleSection').innerHTML = `<div class="date-rail">${pills}</div>`;
  document.querySelectorAll('.date-pill').forEach(b=>{
    b.addEventListener('click', ()=>{ state.selectedDate = b.dataset.date; renderDateRail(); renderCaseGrid(); renderHeroStats(); });
  });
}

function renderCaseGrid(){
  const entries = state.studentData.schedule.filter(s=>s.date === state.selectedDate);
  const container = document.getElementById('caseGridSection');
  document.getElementById('caseDetailSection').innerHTML = '';
  if(entries.length === 0){
    container.innerHTML = '<p class="empty-note">이 날짜에 등록된 사례가 없습니다.</p>';
    return;
  }
  const total = entries.length;
  const required = entries[0].requiredCount || '';
  const banner = required
    ? `<div class="required-banner">📋 이 날짜의 사례는 총 <span class="num">${total}</span>개이며, 그중 <span class="num">${required}</span>개를 작성하세요.</div>`
    : '';

  const cards = entries.map(e=>{
    const found = findCase(e.caseId);
    if(!found) return '';
    return `<div class="case-card" data-caseid="${e.caseId}" data-system="${found.systemName}">
      <div class="cid">${found.item['사례ID']}</div>
      <div class="ctitle">${escapeHtml(found.item['제목'])}</div>
    </div>`;
  }).join('');

  container.innerHTML = banner + `<div class="case-grid">${cards}</div>`;
  container.querySelectorAll('.case-card').forEach(c=>{
    c.addEventListener('click', ()=>{
      state.selectedCase = {systemName: c.dataset.system, caseId: c.dataset.caseid};
      renderCaseDetail();
      document.getElementById('caseDetailSection').scrollIntoView({behavior:'smooth'});
    });
  });
}

function findCase(caseId){
  const systems = state.studentData.systems;
  for(const sys in systems){
    const item = systems[sys].find(c => c['사례ID'] === caseId);
    if(item) return {systemName: sys, item};
  }
  return null;
}

function renderCaseDetail(){
  const container = document.getElementById('caseDetailSection');
  if(!state.selectedCase){ container.innerHTML=''; return; }
  const found = findCase(state.selectedCase.caseId);
  if(!found){ container.innerHTML = '<p class="empty-note">사례를 찾을 수 없습니다.</p>'; return; }
  const c = found.item;
  if(!state.answers[c['사례ID']]) state.answers[c['사례ID']] = {S:'',O:'',A1:'',A2:'',P:'',E:''};
  const ans = state.answers[c['사례ID']];

  const rows = SOAP_ROWS.map(r => `
    <div class="soap-row">
      <div class="soap-row-head">
        <div class="left"><span class="mono-tag">${r.label}</span><span class="en-term">${r.en}</span></div>
        <button class="copy-btn" data-copyrow="${r.key}">복사</button>
      </div>
      <textarea class="soap-input" id="row-${r.key}" placeholder="${r.hint}">${escapeHtml(ans[r.key])}</textarea>
    </div>`).join('');

  container.innerHTML = `
    <button class="back-btn" id="backBtn">← 사례 목록으로</button>
    <div class="chart-panel" id="chartPanel">
      <div class="cid" style="margin-bottom:6px;">${c['사례ID']}</div>
      <h2 class="section-title" style="font-size:19px;text-transform:none;letter-spacing:normal;margin:0 0 14px;color:var(--ink);">${escapeHtml(c['제목'])}</h2>
      <div class="rafts-strip">
        <div class="rafts-cell"><div class="lbl">ROLE</div><div class="val">${escapeHtml(c['Role'])}</div></div>
        <div class="rafts-cell"><div class="lbl">AUDIENCE</div><div class="val">${escapeHtml(c['Audience'])}</div></div>
        <div class="rafts-cell"><div class="lbl">TASK</div><div class="val">${escapeHtml(c['Task'])}</div></div>
      </div>
      <div class="scenario-text">${escapeHtml(c['시나리오'])}</div>
      ${rows}
    </div>
    <div class="action-bar">
      <button class="btn btn-primary" id="copyAllBtn">마크다운으로 전체 복사</button>
      <button class="btn btn-coral" id="saveImgBtn">이미지로 저장</button>
    </div>
  `;

  document.getElementById('backBtn').addEventListener('click', ()=>{ state.selectedCase=null; renderCaseDetail(); });
  SOAP_ROWS.forEach(r=>{
    document.getElementById('row-'+r.key).addEventListener('input', e=>{ ans[r.key] = e.target.value; });
  });
  container.querySelectorAll('[data-copyrow]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.copyrow;
      navigator.clipboard.writeText(document.getElementById('row-'+key).value || '').then(()=>toast(key + ' 복사 완료'));
    });
  });
  document.getElementById('copyAllBtn').addEventListener('click', ()=>{
    const md = buildMarkdown(c, ans);
    navigator.clipboard.writeText(md).then(()=>toast('마크다운으로 전체 복사 완료'));
  });
  document.getElementById('saveImgBtn').addEventListener('click', ()=>saveAsImage(c));
}

function buildMarkdown(c, ans){
  let md = `## ${c['제목']}\n\n`;
  md += `**Role** ${c['Role']}\n\n**Audience** ${c['Audience']}\n\n**Task** ${c['Task']}\n\n`;
  md += `### 시나리오\n${c['시나리오']}\n\n`;
  SOAP_ROWS.forEach(r=>{
    md += `**${r.label} (${r.en})**\n${ans[r.key] || ''}\n\n`;
  });
  return md.trim();
}

function saveAsImage(c){
  const original = document.getElementById('chartPanel');
  const clone = original.cloneNode(true);
  // html2canvas는 textarea의 입력값을 제대로 그리지 못하므로,
  // 캡처용 임시 복제본에서는 textarea를 같은 텍스트의 div로 바꿔치기한다.
  clone.querySelectorAll('textarea').forEach(ta=>{
    const div = document.createElement('div');
    div.className = 'soap-input';
    div.style.whiteSpace = 'pre-wrap';
    div.style.minHeight = 'auto';
    div.textContent = ta.value || '(작성 없음)';
    ta.parentNode.replaceChild(div, ta);
  });
  clone.querySelectorAll('.copy-btn').forEach(b=>b.remove());
  clone.style.position = 'fixed';
  clone.style.top = '0';
  clone.style.left = '-9999px';
  clone.style.width = original.offsetWidth + 'px';
  document.body.appendChild(clone);
  html2canvas(clone, {backgroundColor:'#ffffff', scale:2}).then(canvas=>{
    document.body.removeChild(clone);
    const link = document.createElement('a');
    link.download = (c['사례ID'] || 'soape') + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).catch(()=>{
    document.body.removeChild(clone);
    toast('이미지 저장에 실패했습니다.');
  });
}

    </div>`;

function renderAdminTab(tab){

  if(tab==='cases') return renderCasesTab();

function renderCasesTab(){
  const body = document.getElementById('adminBody');
  const names = systemNames();
  body.innerHTML = `
    <div class="inline-form" style="margin-bottom:14px;">
      <select id="caseSystemSelect">${names.map(n=>`<option value="${n}">${n}</option>`).join('')}</select>

    <div id="caseList"></div>

  `;

  document.getElementById('addCaseBtn').addEventListener('click', ()=> renderCaseEditForm(null, select.value));
  renderCaseList();

  function renderCaseList(){
    const sys = select.value;
    const list = state.adminData.systems[sys] || [];
    document.getElementById('caseList').innerHTML = `<div class="admin-card">${
      list.map(c=>`<div class="admin-row"><span>${c['사례ID']} · ${escapeHtml(c['제목'])}</span><button class="pill-btn" data-editcase="${c['사례ID']}">편집</button></div>`).join('')

    const fieldsOrder = ['제목','Role','Audience','Task','시나리오','모범_S','모범_O','모범_A1','모범_A2','모범_P','모범_E'];

    }catch(e){ toast(e.message); }
  });
  document.querySelectorAll('[data-resetdate]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(!confirm(b.dataset.resetdate + ' 날짜의 사례 배정을 모두 초기화할까요?')) return;
      try{
        await api('resetScheduleDate', {}, {date: b.dataset.resetdate});
        await loadAdminData(state.adminPw);
        toast('초기화되었습니다.');
        renderScheduleTab();
      }catch(e){ toast(e.message); }
    });
  });
}

function renderSettingsTab(){
  const body = document.getElementById('adminBody');
  body.innerHTML = `
    <div class="admin-card">
      <div class="field"><label>Gemini Gems 공유 링크</label><input type="text" id="setGems" value="${escapeHtml(state.adminData.gemsLink||'')}"></div>
      <div class="field"><label>관리자 비밀번호 변경</label><input type="text" id="setPw" placeholder="새 비밀번호"></div>
      <div class="modal-actions"><button class="btn btn-primary" id="saveSettingsBtn">저장</button></div>
    </div>`;
  document.getElementById('saveSettingsBtn').addEventListener('click', async ()=>{
    const fields = {GemsLink: document.getElementById('setGems').value};
    const newPw = document.getElementById('setPw').value;
    if(newPw) fields['관리자비밀번호'] = newPw;
    try{
      await api('updateSettings', fields);
      if(newPw) state.adminPw = newPw;
      await loadAdminData(state.adminPw);
      toast('설정이 저장되었습니다.');
    }catch(e){ toast(e.message); }
  });
}

/* ======================= 히어로: 스탯 카드 / CTA / Gems 토스트 ======================= */
function renderHeroStats(){
  const dates = allScheduleDates();
  const todayEntries = state.studentData.schedule.filter(s=>s.date===state.selectedDate);
  const totalCases = Object.values(state.studentData.systems).reduce((sum, arr)=>sum+arr.length, 0);
  const required = todayEntries[0] ? (todayEntries[0].requiredCount || '-') : '-';

  const stats = [
    {icon:'📋', val: todayEntries.length, lbl:'오늘 등록된 사례'},
    {icon:'✏️', val: required, lbl:'오늘의 필수 작성 개수'},
    {icon:'🗂️', val: totalCases, lbl:'전체 등록된 사례 수'}
  ];
  document.getElementById('statFloatRow').innerHTML = stats.map(s=>`
    <div class="stat-card">
      <div class="stat-icon">${s.icon}</div>
      <div><div class="stat-val">${s.val}</div><div class="stat-lbl">${s.lbl}</div></div>
    </div>`).join('');

  const gemsBox = document.getElementById('gemsToast');
  const link = state.studentData.gemsLink;
  if(link){
    gemsBox.style.display = 'flex';
    gemsBox.innerHTML = `<div class="check">✓</div><div>작성이 막막하다면? <a href="${escapeHtml(link)}" target="_blank" rel="noopener">Gemini Gems 열어보기 →</a></div>`;
  }else{
    gemsBox.style.display = 'none';
  }
}

function wireHeroCta(){
  document.getElementById('ctaGuide').addEventListener('click', ()=>{
    document.getElementById('guideAccordion').classList.add('open');
    document.getElementById('guideAccordion').scrollIntoView({behavior:'smooth', block:'start'});
  });
  document.getElementById('ctaCases').addEventListener('click', ()=>{
    document.getElementById('scheduleSection').scrollIntoView({behavior:'smooth', block:'start'});
  });
}

/* ======================= 초기화 ======================= */
async function boot(){
  initGuide();
  wireHeroCta();
  document.getElementById('adminBtn').addEventListener('click', openAdminLoginModal);
  try{
    await loadStudentData();
    renderDateRail();
    renderCaseGrid();
    renderHeroStats();
  }catch(e){
    document.getElementById('scheduleSection').innerHTML = '<p class="empty-note">데이터를 불러오지 못했습니다. CONFIG.API_URL 설정을 확인해주세요.</p>';
  }
}
boot();
</script>
